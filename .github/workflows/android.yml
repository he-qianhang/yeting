name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Unit tests, lint and builds
        working-directory: android
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:testReleaseUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
